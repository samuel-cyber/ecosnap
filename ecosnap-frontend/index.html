<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EcoSnap — report it, clean it up</title>
  <meta name="description" content="Report burning trash and blocked drains in Lagos. Earn EcoPoints for your neighborhood." />
  <meta name="theme-color" content="#f6f7f4" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230f5132' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 21.5V12.6'/%3E%3Cpath d='M12 12.6c0-4.3 3.1-7.7 9.3-8.1.5 4.6-1.8 9.5-9.3 8.1z'/%3E%3Cpath d='M12 16.6C11.3 13.4 8.7 10.9 3.4 10.5c-.4 3.6 1.4 7.4 7 6.4z'/%3E%3C/svg%3E" />

  <!-- Third-party libraries (UMD globals, no build step). -->
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
  <script defer src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>

  <!-- Written at build time from environment variables (scripts/build-config.js).
       Absent during local development, which is why the load is optional. -->
  <script defer src="config.generated.js" onerror="void 0"></script>
  <!-- Optional, gitignored: local overrides, which win over the generated file. -->
  <script defer src="config.local.js" onerror="void 0"></script>
</head>
<body>
  <div id="setup-banner" class="setup-banner" hidden></div>

  <header id="topbar" class="topbar" hidden>
    <a class="brand" href="#/map">
      <span class="brand-mark"><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d='M12 21.5V12.6'/><path d='M12 12.6c0-4.3 3.1-7.7 9.3-8.1.5 4.6-1.8 9.5-9.3 8.1z'/><path d='M12 16.6C11.3 13.4 8.7 10.9 3.4 10.5c-.4 3.6 1.4 7.4 7 6.4z'/></svg></span>
      <span class="brand-name">EcoSnap</span>
    </a>
    <button id="points-chip" class="points-chip" type="button" title="Your EcoPoints">
      <span id="points-value">0</span> <span class="unit">pts</span>
    </button>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav id="tabbar" class="tabbar" hidden>
    <a href="#/capture" data-tab="capture"><svg class="ico" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d='M3 8.5A1.5 1.5 0 0 1 4.5 7h2.2a1 1 0 0 0 .83-.45l.94-1.4A1 1 0 0 1 9.3 4.7h5.4a1 1 0 0 1 .83.45l.94 1.4a1 1 0 0 0 .83.45h2.2A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z'/><circle cx='12' cy='12.8' r='3.4'/></svg>Report</a>
    <a href="#/map" data-tab="map"><svg class="ico" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d='m9 5-5.3 2.1a1 1 0 0 0-.7 1V19a.6.6 0 0 0 .85.55L9 17.4'/><path d='m15 6.6 5.15-2.06A.6.6 0 0 1 21 5.1v10.9a1 1 0 0 1-.7.93L15 19'/><path d='M9 5v12.4'/><path d='M15 6.6V19'/></svg>Map</a>
    <a href="#/leaderboard" data-tab="leaderboard"><svg class="ico" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d='M4 20h16'/><rect x='4.5' y='12' width='4' height='5' rx='1'/><rect x='10' y='7' width='4' height='10' rx='1'/><rect x='15.5' y='14' width='4' height='3' rx='1'/></svg>Ranks</a>
    <a href="#/profile" data-tab="profile"><svg class="ico" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d='M12 20.5V11'/><path d='M12 11c0-3.6 2.6-6.5 8-6.9.4 3.9-1.6 8.1-8 6.9z'/><path d='M12 14.4C11.4 11.7 9.2 9.6 4.7 9.3c-.3 3 1.2 6.2 6 5.4z'/></svg>Impact</a>
    <a href="#/redeem" data-tab="redeem"><svg class="ico" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x='3.5' y='9.5' width='17' height='10.5' rx='1.4'/><path d='M2.6 6.6h18.8v2.9H2.6z'/><path d='M12 6.6v13.4'/><path d='M12 6.6S10.8 3 8.6 3a2 2 0 0 0 0 3.6z'/><path d='M12 6.6S13.2 3 15.4 3a2 2 0 0 1 0 3.6z'/></svg>Rewards</a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
