<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EcoSnap — report it, clean it up</title>
  <meta name="description" content="Report burning trash and blocked drains in Lagos. Earn EcoPoints for your neighborhood." />
  <meta name="theme-color" content="#0f1a14" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🌍</text></svg>" />

  <!-- Third-party libraries (UMD globals, no build step). -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>

  <!-- Optional, gitignored: overrides API/Supabase/Mapbox/model settings. -->
  <script src="config.local.js" onerror="void 0"></script>
</head>
<body>
  <div id="setup-banner" class="setup-banner" hidden></div>

  <header id="topbar" class="topbar" hidden>
    <a class="brand" href="#/map">
      <span class="brand-mark">🌍</span>
      <span class="brand-name">EcoSnap</span>
    </a>
    <button id="points-chip" class="points-chip" type="button" title="Your EcoPoints">
      <span id="points-value">0</span> pts
    </button>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav id="tabbar" class="tabbar" hidden>
    <a href="#/capture" data-tab="capture"><span>📷</span>Report</a>
    <a href="#/map" data-tab="map"><span>🗺️</span>Map</a>
    <a href="#/leaderboard" data-tab="leaderboard"><span>🏆</span>Ranks</a>
    <a href="#/profile" data-tab="profile"><span>🌱</span>Impact</a>
    <a href="#/redeem" data-tab="redeem"><span>🎁</span>Rewards</a>
  </nav>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
